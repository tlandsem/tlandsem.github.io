# Sertifiseringer som vises på About me og Labs.
# Legg nye sertifiseringer ØVERST i listen (nyeste først).
#
# Felter:
#   name:        Navn på sertifiseringen (påkrevd)
#   issuer:      Hvem som har utstedt den (påkrevd)
#   date:        Når du fikk den, f.eks. "Nov 2026" (valgfritt)
#   description: Kort beskrivelse, én eller to setninger (valgfritt)
#   image:       Bilde av sertifikatet/merket. Lokal fil i static/images/ eller en https-adresse (valgfritt)
#   image_alt:   Beskrivelse av bildet for skjermlesere (påkrevd hvis image er satt)
#   url:         Lenke der sertifikatet kan verifiseres (valgfritt)
#   verified:    Teksten under, f.eks. "Verified Credential" (valgfritt)
#
# Tips: Bruker du et bilde fra en annen nettside enn images.credly.com, må den
# adressen også legges til i img-src i CSP-regelen i Cloudflare. Lokale bilder virker alltid.

