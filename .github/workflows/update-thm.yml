name: Oppdater TryHackMe-data

# Den automatiske nattkjøringen er slått av fordi TryHackMe blokkerer GitHub (HTTP 429).
# Oppdateringen skjer i stedet fra din egen PC med scripts/oppdater_thm.bat.
# Du kan fortsatt prøve manuelt fra Actions-fanen.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/update_thm.py
      - name: Commit hvis noe er endret
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/thm.json
          git diff --cached --quiet || (git commit -m "Oppdater TryHackMe-data" && git push)
