name: Oppdater TryHackMe-data

on:
  schedule:
    - cron: "0 4 * * *"   # hver natt kl. 04:00 UTC
  workflow_dispatch:       # lar deg kjøre den manuelt fra Actions-fanen

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_thm.py
      - name: Commit hvis noe er endret
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/thm.json
          git diff --cached --quiet || (git commit -m "Oppdater TryHackMe-data" && git push)
